<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Home lab network diagram</title>
<desc>A Windows laptop running Oracle VirtualBox hosts DC01, CLIENT100 and CLIENT200 on a private labnet network. DC01 reaches the internet through NAT. CLIENT200 manages DC01 remotely with RSAT.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>
<rect x="40" y="90" width="600" height="410" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="112" font-size="12" fill="#5F5E5A">Windows laptop, Oracle VirtualBox</text>
<text x="624" y="112" font-size="12" fill="#5F5E5A" text-anchor="end">Domain: lab.local</text>
<rect x="250" y="20" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="40" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Internet</text>
<line x1="340" y1="60" x2="340" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="80" font-size="12" fill="#5F5E5A">NAT adapter, 10.0.2.15</text>
<rect x="210" y="130" width="260" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="152" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle" dominant-baseline="central">DC01</text>
<text x="340" y="172" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">Domain controller for lab.local</text>
<text x="340" y="190" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">AD DS, DNS, DHCP, GPO</text>
<text x="340" y="208" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">Windows Server 2025</text>
<line x1="340" y1="226" x2="340" y2="270" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="352" y="252" font-size="12" fill="#5F5E5A">192.168.50.10 (static)</text>
<rect x="70" y="270" width="540" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="290" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Internal network labnet, 192.168.50.0/24</text>
<line x1="190" y1="310" x2="190" y2="360" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="202" y="340" font-size="12" fill="#5F5E5A">DHCP lease</text>
<line x1="490" y1="310" x2="490" y2="360" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="502" y="340" font-size="12" fill="#5F5E5A">DHCP lease</text>
<rect x="70" y="360" width="240" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190" y="382" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle" dominant-baseline="central">CLIENT100</text>
<text x="190" y="402" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Windows 11 domain client</text>
<text x="190" y="420" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Standard user workstation</text>
<rect x="370" y="360" width="240" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="490" y="382" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle" dominant-baseline="central">CLIENT200</text>
<text x="490" y="402" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Windows 11 admin workstation</text>
<text x="490" y="420" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">RSAT: Server Manager, AD tools</text>
<path d="M610 402 L626 402 L626 178 L474 178" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowp)"/>
<text x="490" y="168" font-size="12" fill="#5F5E5A">Remote management</text>
<rect x="70" y="462" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="92" y="470" font-size="12" fill="#5F5E5A" dominant-baseline="central">Windows Server</text>
<rect x="210" y="462" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text x="232" y="470" font-size="12" fill="#5F5E5A" dominant-baseline="central">Windows 11 client</text>
<line x1="366" y1="469" x2="396" y2="469" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="404" y="470" font-size="12" fill="#5F5E5A" dominant-baseline="central">RSAT remote management</text>
</svg>
